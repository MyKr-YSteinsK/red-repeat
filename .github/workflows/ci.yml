name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      RED_REPEAT_BUILD_SHA: ${{ github.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Install dependencies
        run: npm ci

      - name: Verify release ledger
        run: npm run release:verify

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Validate Library source
        run: npm run library:validate

      - name: Compile runtime resources
        run: npm run library:compile

      - name: Verify repository hygiene
        run: npm run repo:hygiene

      - name: Build
        run: npm run build

      - name: Verify PWA artifact
        run: npm run pwa:inspect

      - name: Build subpath artifact
        run: npm run build -- --base=/red-repeat/

      - name: Verify subpath PWA artifact
        run: npm run pwa:inspect -- /red-repeat/

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest
    env:
      RED_REPEAT_BUILD_SHA: ${{ github.sha }}
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Library source
        run: npm run library:validate

      - name: Compile runtime resources
        run: npm run library:compile

      - name: Build Pages artifact
        run: npm run build -- --base=/red-repeat/

      - name: Verify Pages PWA artifact
        run: npm run pwa:inspect -- /red-repeat/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Read package version
        id: package-version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify production build identity
        env:
          DEPLOYMENT_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_VERSION: ${{ steps.package-version.outputs.version }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: npm run release:smoke -- --url "$DEPLOYMENT_URL" --version "$EXPECTED_VERSION" --commit "$EXPECTED_COMMIT"
