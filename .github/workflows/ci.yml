name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      RED_REPEAT_BUILD_SHA: ${{ github.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Install dependencies
        run: npm ci

      - name: Verify release ledger
        run: npm run release:verify

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Validate Library source
        run: npm run library:validate

      - name: Compile runtime resources
        run: npm run library:compile

      - name: Verify repository hygiene
        run: npm run repo:hygiene

      - name: Build
        run: npm run build

      - name: Verify PWA artifact
        run: npm run pwa:inspect

      - name: Build subpath artifact
        run: npm run build -- --base=/red-repeat/

      - name: Verify subpath PWA artifact
        run: npm run pwa:inspect -- /red-repeat/

  pages_artifact:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    env:
      RED_REPEAT_BUILD_SHA: ${{ github.sha }}
      PAGES_ARTIFACT: github-pages-${{ github.run_attempt }}
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact_id }}
      artifact_name: ${{ steps.identity.outputs.name }}
      sha: ${{ steps.identity.outputs.sha }}
      version: ${{ steps.identity.outputs.version }}
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Library source
        run: npm run library:validate

      - name: Compile runtime resources
        run: npm run library:compile

      - name: Build Pages artifact
        run: npm run build -- --base=/red-repeat/

      - name: Verify Pages PWA artifact
        run: npm run pwa:inspect -- /red-repeat/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        id: upload
        uses: actions/upload-pages-artifact@v4
        with:
          name: ${{ env.PAGES_ARTIFACT }}
          path: dist

      - name: Record uploaded build identity
        id: identity
        run: |
          echo "name=$PAGES_ARTIFACT" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: pages_artifact
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      PAGES_ARTIFACT: ${{ needs.pages_artifact.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Verify the successful upload and current main
        env:
          GH_TOKEN: ${{ github.token }}
          UPLOAD_SHA: ${{ needs.pages_artifact.outputs.sha }}
          ARTIFACT_ID: ${{ needs.pages_artifact.outputs.artifact_id }}
        run: bash scripts/verify-pages-upload.sh

      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT }}

      - name: Verify production build identity
        env:
          DEPLOYMENT_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_VERSION: ${{ needs.pages_artifact.outputs.version }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: node scripts/verify-deployed-version.ts --url "$DEPLOYMENT_URL" --version "$EXPECTED_VERSION" --commit "$EXPECTED_COMMIT"
