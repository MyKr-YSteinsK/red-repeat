name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Install dependencies
        run: npm ci

      - name: Verify release ledger
        run: npm run release:verify

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Validate Library source
        run: npm run library:validate

      - name: Verify repository hygiene
        run: npm run repo:hygiene

      - name: Build
        run: npm run build

      - name: Verify PWA artifact
        run: npm run pwa:inspect

      - name: Build subpath artifact
        run: npm run build -- --base=/red-repeat/

      - name: Verify subpath PWA artifact
        run: npm run pwa:inspect -- /red-repeat/
